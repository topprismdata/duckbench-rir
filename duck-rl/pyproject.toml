# The Duck Arena RL kit for players (kit 1.3.0; docs/player-kit-decisions-log.md PK-02): a uv project, not a package.
# `uv sync` (run by `duckbench kit init`), then `uv run python train.py ...` from this folder.
# The pins are the move lab's (spikes/move-lab/requirements.txt): training parity with the TS sim depends on
# mujoco + numpy + numba. Platforms: Apple-silicon Macs (the MLX learner) and Linux (the CPU learner, CPU torch).
[project]
name = "duckbench-kit"
version = "1.3.0"
description = "Train moves for the Microduck on DuckBench Challenges (PPO in a MuJoCo env; scored by the duckbench CLI's TS sim)"
requires-python = "==3.12.*"
dependencies = [
    "mujoco==3.14.0",
    "numpy==2.5.3",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "torch==2.9.1",
    "rsl-rl-lib==5.5.1",
    "tensordict==0.14.2",
    "onnx==1.23.0",          # the learner exports each checkpoint to ONNX (lab/learn.py export_onnx)
    "onnxscript==0.7.2",
    "onnxruntime==1.30.0",
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",  # the PPO update on the Apple GPU
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
